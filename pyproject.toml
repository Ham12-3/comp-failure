[project]
name = "cfp"
version = "0.1.0"
description = "Predict the 12-month insolvency risk of UK companies from free Companies House data."
readme = "README.md"
authors = [{ name = "Abdulhamid Sonaike" }]
requires-python = ">=3.12,<3.13"
# Runtime dependencies are added phase by phase, only when code needs them.
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "ixbrlparse>=0.12.0",
    "lightgbm>=4.7.0",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "polars>=2.1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-lxml>=2026.2.16",
]
train = [
    "mlflow>=3.18.0",
]

[tool.uv]
# `uv sync` installs training tools locally; the Docker image skips them (--no-default-groups).
default-groups = ["dev", "train"]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "N",   # pep8-naming
    "PTH", # prefer pathlib
    "DTZ", # naive datetimes are a leakage hazard: be explicit about dates
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# No type information published for these.
module = ["sklearn.*", "shap.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests marked `network` hit the real Companies House API. They are skipped by
# default (and in CI); run them explicitly with `uv run pytest -m network`.
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not network"]
markers = [
    "network: test calls the real Companies House API (needs COMPANIES_HOUSE_API_KEY)",
]
filterwarnings = [
    # ixbrlparse calls a BeautifulSoup method deprecated in bs4 4.13; not our code.
    "ignore:Call to deprecated method findChildren:DeprecationWarning",
    # shap notice about its own output format; cfp.train.explain handles both formats.
    "ignore:LightGBM binary classifier with TreeExplainer shap values output has changed:UserWarning",
    # Starlette notice about the TestClient's own HTTP library; nothing to change on our side.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["cfp"]
branch = true
